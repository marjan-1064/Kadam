<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" width="100%" height="100%">
  <!-- Background -->
  <rect width="500" height="200" fill="#1A1F2C" rx="12"/>

  <!-- Icon: Abstract Footprint & Arrow -->
  <g transform="translate(60, 40)">
    <!-- Heel / Base -->
    <path d="M 30,100 C 15,100 10,80 15,60 C 20,40 35,30 50,30 C 65,30 75,45 70,65 C 65,85 45,100 30,100 Z" fill="#2D524B"/>
    
    <!-- Arch / Dynamic Swoosh -->
    <path d="M 45,40 C 65,20 90,15 110,30 C 120,38 115,50 100,50 C 80,50 60,45 45,40 Z" fill="#E9C46A"/>
    
    <!-- Forward Toe Dots (Steps) -->
    <circle cx="115" cy="18" r="7" fill="#E9C46A"/>
    <circle cx="95" cy="10" r="5.5" fill="#E9C46A" opacity="0.8"/>
    <circle cx="78" cy="8" r="4" fill="#E9C46A" opacity="0.6"/>
  </g>

  <!-- Brand Text -->
  <text x="210" y="108" font-family="'Poppins', 'Montserrat', sans-serif" font-weight="800" font-size="52" fill="#FFFFFF" letter-spacing="3">
    KADAM
  </text>
  
  <!-- Tagline -->
  <text x="212" y="135" font-family="'Inter', sans-serif" font-weight="500" font-size="14" fill="#E9C46A" letter-spacing="6">
    EVERY STEP COUNTS
  </text>
</svg>
